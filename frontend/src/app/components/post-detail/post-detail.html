<div class="breadcrumb">
  <a routerLink="/">&laquo; Back to Posts</a>
</div>

<div class="detail-box" *ngIf="post; else loadingPost">
  <div class="detail-header">
    <h2>{{ post.title }}</h2>
    <div class="detail-meta">
      Posted by <strong>{{ post.firstName }} {{ post.lastName }}</strong> on {{ post.dateCreated | date: 'mediumDate' }}
    </div>
  </div>

  <div class="detail-body">
    <p>{{ post.body }}</p>
  </div>
</div>

<ng-template #loadingPost>
  <div class="loading-box">Loading post...</div>
</ng-template>
